<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Efficiency Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800">Logistics Efficiency Protocol</h1>
            <p class="text-gray-600 mt-2">Find the optimal contiguous load without exceeding weight limit</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Add box weight -->
            <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Add Box Weight (kg)</label>
                <div class="flex gap-2">
                    <input type="number" id="weightInput" placeholder="e.g., 25" step="1" min="1"
                        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="addBtn"
                        class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2 rounded-lg transition">Add</button>
                </div>
            </div>

            <!-- Weight limit -->
            <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Weight Limit (kg)</label>
                <input type="number" id="limitInput" value="100" step="5" min="1"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div class="mb-8">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-semibold text-gray-800">Cargo Boxes</h2>
                <span id="totalCount" class="text-sm bg-gray-200 px-3 py-1 rounded-full">0 boxes</span>
            </div>
            <div id="boxesContainer"
                class="flex flex-wrap gap-3 min-h-[120px] bg-gray-50 p-4 rounded-xl border border-gray-200">
                <p id="emptyMessage" class="text-gray-400 text-center w-full py-6">No boxes added yet. Add some weights
                    above.</p>
            </div>
        </div>

        <div id="resultPanel" class="bg-blue-50 border-l-4 border-blue-700 p-5 rounded-lg hidden">
            <h3 class="font-bold text-blue-800 text-lg mb-2">Optimal Load Selection</h3>
            <div id="resultDetails" class="text-gray-700"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
